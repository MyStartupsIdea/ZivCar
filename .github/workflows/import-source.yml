name: import-source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip import]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download archive
        run: curl -fsSL "https://site-55ede1455abe4e418b224063f15c7198.freebuff.page/zivcar-src.tar.gz" -o "$RUNNER_TEMP/src.tar.gz"
      - name: Unpack
        run: tar xzf "$RUNNER_TEMP/src.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Commit
        run: |
          git config user.name "ZivCar import"
          git config user.email "import@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to import"; exit 0; fi
          git commit -m "Import project source [skip import]"
          git push
